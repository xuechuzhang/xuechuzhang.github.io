<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="980" height="500" role="img" aria-labelledby="title desc"><title id="title">Shared artificial actors: proposed human study</title><desc id="desc">Three independent private encounters precede an immediate or delayed first human meeting. Later trust, shared reality, norms and coordination remain untested research questions.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#99475f"/></marker></defs><rect width="980" height="500" fill="white"/><g font-family="Arial,Helvetica,sans-serif" fill="#29272a"><text x="30" y="32" font-size="12" fill="#99475f">SHARED ACTORS / PROPOSED BEHAVIORAL DESIGN</text><text x="30" y="61" font-size="25" fill="#29272a">One social reference. Three private histories.</text><rect x="30" y="90" width="272" height="117" fill="#faf5f7" stroke="#d8c5cb"/><text x="46" y="117" font-size="17" fill="#99475f">Person A</text><text x="46" y="141" font-size="13" fill="#625a5e">Same Character X in shared condition</text><text x="46" y="162" font-size="13" fill="#625a5e">Own choices, transcript and events</text><text x="46" y="183" font-size="13" fill="#625a5e">Separate characters in control</text><path d="M166 207 L166 251" fill="none" stroke="#99475f" stroke-width="1.3" marker-end="url(#arrow)"/><rect x="354" y="90" width="272" height="117" fill="#faf5f7" stroke="#d8c5cb"/><text x="370" y="117" font-size="17" fill="#99475f">Person B</text><text x="370" y="141" font-size="13" fill="#625a5e">Same Character X in shared condition</text><text x="370" y="162" font-size="13" fill="#625a5e">Own choices, transcript and events</text><text x="370" y="183" font-size="13" fill="#625a5e">Separate characters in control</text><path d="M490 207 L490 251" fill="none" stroke="#99475f" stroke-width="1.3" marker-end="url(#arrow)"/><rect x="678" y="90" width="272" height="117" fill="#faf5f7" stroke="#d8c5cb"/><text x="694" y="117" font-size="17" fill="#99475f">Person C</text><text x="694" y="141" font-size="13" fill="#625a5e">Same Character X in shared condition</text><text x="694" y="162" font-size="13" fill="#625a5e">Own choices, transcript and events</text><text x="694" y="183" font-size="13" fill="#625a5e">Separate characters in control</text><path d="M814 207 L814 251" fill="none" stroke="#99475f" stroke-width="1.3" marker-end="url(#arrow)"/><rect x="30" y="254" width="920" height="99" fill="#faf5f7" stroke="#99475f" stroke-dasharray="5 5"/><text x="46" y="281" font-size="17" fill="#99475f">First human meeting · AI absent</text><text x="46" y="305" font-size="13" fill="#625a5e">Independent three-person groups · Immediate OR seven days later</text><text x="46" y="326" font-size="13" fill="#625a5e">First cooperation choice, then a human discussion</text><text x="46" y="347" font-size="13" fill="#625a5e">Proposed scheduling and human-group phase: not implemented</text><path d="M490 353 L490 386" fill="none" stroke="#99475f" stroke-width="1.3" marker-end="url(#arrow)"/><rect x="30" y="390" width="920" height="85" fill="#faf5f7" stroke="#99475f" stroke-dasharray="5 5"/><text x="46" y="417" font-size="17" fill="#99475f">Questions, not findings</text><text x="46" y="441" font-size="13" fill="#625a5e">Trust? Shared reality? Norms? Coordination? Shared group language?</text><text x="46" y="462" font-size="13" fill="#625a5e">Current software verifies identity and independent state, not these human outcomes.</text></g></svg>