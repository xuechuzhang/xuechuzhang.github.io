<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" role="img" aria-labelledby="title desc">
<title id="title">Scaffolding AI: implemented policy and state architecture</title><desc id="desc">A public mode and scenario select a versioned authored policy. Validated private page state drives safe text rendering and a local event trace. The transfer whitelist hides prior assistance; blinded behavioral evaluation is future work.</desc>
