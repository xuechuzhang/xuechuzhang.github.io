<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 610" width="980" height="610" role="img" aria-labelledby="title desc"><title id="title">Prototype 02 architecture</title><desc id="desc">Implemented public configuration, authored policies, validated state, page-memory data, text-node rendering, minimal events, transfer whitelist and review. A dashed behavioral evaluation is proposed.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#99475f"/></marker></defs><rect width="980" height="610" fill="white"/><g font-family="Arial,Helvetica,sans-serif" fill="#29272a"><text x="30" y="32" font-size="12" fill="#99475f">PROTOTYPE 02 / ACTUAL ARCHITECTURE · v0.3.0</text><text x="30" y="61" font-size="25" fill="#29272a">A policy, a state machine, and a data boundary.</text><rect x="30" y="90" width="280" height="102" fill="#faf5f7" stroke="#d8c5cb"/><text x="46" y="117" font-size="17" fill="#99475f">Public configuration</text><text x="46" y="141" font-size="13" fill="#625a5e">mode · scenario · embed</text><text x="46" y="162" font-size="13" fill="#625a5e">Allowlisted values only</text><text x="46" y="183" font-size="13" fill="#625a5e">No response text in URL</text><rect x="350" y="90" width="282" height="102" fill="#faf5f7" stroke="#d8c5cb"/><text x="366" y="117" font-size="17" fill="#99475f">Authored policy registry</text><text x="366" y="141" font-size="13" fill="#625a5e">Three immutable policies</text><text x="366" y="162" font-size="13" fill="#625a5e">Two fictional scenario pairs</text><text x="366" y="183" font-size="13" fill="#625a5e">Four self-reported strategy labels</text><path d="M310 140 L350 140" fill="none" stroke="#99475f" stroke-width="1.3" marker-end="url(#arrow)"/><rect x="672" y="90" width="278" height="102" fill="#faf5f7" stroke="#d8c5cb"/><text x="688" y="117" font-size="17" fill="#99475f">Validated state machine</text><text x="688" y="141" font-size="13" fill="#625a5e">Initial → policy → strategy → response</text><text x="688" y="162" font-size="13" fill="#625a5e">End help → new task → review</text><text x="688" y="183" font-size="13" fill="#625a5e">Bounded inputs; guarded transitions</text><path d="M632 140 L672 140" fill="none" stroke="#99475f" stroke-width="1.3" marker-end="url(#arrow)"/><rect x="30" y="235" width="425" height="112" fill="#faf5f7" stroke="#d8c5cb"/><text x="46" y="262" font-size="17" fill="#99475f">Private page memory</text><text x="46" y="286" font-size="13" fill="#625a5e">Initial reading · reflections · selected strategy</text><text x="46" y="307" font-size="13" fill="#625a5e">First response · unaided response · ordered events</text><text x="46" y="328" font-size="13" fill="#625a5e">No persistent storage, backend, or model call</text><rect x="495" y="235" width="455" height="112" fill="#faf5f7" stroke="#d8c5cb"/><text x="511" y="262" font-size="17" fill="#99475f">Text-node UI + minimal trace</text><text x="511" y="286" font-size="13" fill="#625a5e">Safe text rendering; keyboard labels and status</text><text x="511" y="307" font-size="13" fill="#625a5e">Events: sequence/time/type + IDs and character counts</text><text x="511" y="328" font-size="13" fill="#625a5e">No automated interpretation, score, or classification</text><path d="M811 192 L811 235" fill="none" stroke="#99475f" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M455 291 L495 291" fill="none" stroke="#99475f" stroke-width="1.3" marker-end="url(#arrow)"/><rect x="30" y="388" width="425" height="103" fill="#faf5f7" stroke="#d8c5cb"/><text x="46" y="415" font-size="17" fill="#99475f">New-task view whitelist</text><text x="46" y="439" font-size="13" fill="#625a5e">Only phase, novel title, and context from the engine</text><text x="46" y="460" font-size="13" fill="#625a5e">Prior history, strategy, draft and trace not displayed</text><text x="46" y="481" font-size="13" fill="#625a5e">Client source and human memory remain accessible</text><rect x="495" y="388" width="455" height="103" fill="#faf5f7" stroke="#d8c5cb"/><text x="511" y="415" font-size="17" fill="#99475f">Local review and reset</text><text x="511" y="439" font-size="13" fill="#625a5e">Own responses and copied record · prototype02.demo.v3</text><text x="511" y="460" font-size="13" fill="#625a5e">Reset/reload/navigation clear state and visible text</text><text x="511" y="481" font-size="13" fill="#625a5e">No transmission or automatic file export</text><path d="M242 347 L242 388" fill="none" stroke="#99475f" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M721 347 L721 388" fill="none" stroke="#99475f" stroke-width="1.3" marker-end="url(#arrow)"/><rect x="30" y="523" width="920" height="65" fill="#faf5f7" stroke="#99475f" stroke-dasharray="5 5"/><text x="46" y="550" font-size="17" fill="#99475f">Proposed: behavioral evaluation / not connected</text><text x="46" y="574" font-size="13" fill="#625a5e">Ethics and consent · random assignment · matched tasks · blinded ratings · delayed and human transfer</text></g></svg>