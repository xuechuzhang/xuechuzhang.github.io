<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" width="980" height="430" role="img" aria-labelledby="title desc"><title id="title">Scaffolding AI: implemented flow</title><desc id="desc">An initial reading precedes three policies. All routes require a chosen strategy and own response. Assistance ends before a new unaided situation. Review is descriptive, not a score.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#99475f"/></marker></defs><rect width="980" height="430" fill="white"/><g font-family="Arial,Helvetica,sans-serif" fill="#29272a"><text x="30" y="32" font-size="12" fill="#99475f">PROTOTYPE 02 / IMPLEMENTED FLOW · v0.3.0</text><text x="30" y="61" font-size="25" fill="#29272a">One question. Three policies. A new task without help.</text><rect x="30" y="95" width="165" height="88" fill="#faf5f7" stroke="#d8c5cb"/><text x="46" y="122" font-size="17" fill="#99475f">1 / Initial reading</text><text x="46" y="146" font-size="13" fill="#625a5e">Your interpretation</text><text x="46" y="167" font-size="13" fill="#625a5e">before help</text><rect x="230" y="95" width="220" height="68" fill="#faf5f7" stroke="#d8c5cb"/><text x="246" y="122" font-size="17" fill="#99475f">Direct AI</text><text x="246" y="146" font-size="13" fill="#625a5e">Authored reading/action/draft</text><rect x="230" y="177" width="220" height="68" fill="#faf5f7" stroke="#d8c5cb"/><text x="246" y="204" font-size="17" fill="#99475f">Scaffolding AI</text><text x="246" y="228" font-size="13" fill="#625a5e">Five written reflections</text><rect x="230" y="259" width="220" height="68" fill="#faf5f7" stroke="#d8c5cb"/><text x="246" y="286" font-size="17" fill="#99475f">Independent Reflection</text><text x="246" y="310" font-size="13" fill="#625a5e">No candidate reading/draft</text><path d="M195 139 L216 139" fill="none" stroke="#99475f" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M215 129 V293 M215 129 H229 M215 211 H229 M215 293 H229 M450 129 H475 V293 M450 211 H475 M450 293 H475" fill="none" stroke="#99475f"/><path d="M475 211 L506 211" fill="none" stroke="#99475f" stroke-width="1.3" marker-end="url(#arrow)"/><rect x="507" y="167" width="184" height="91" fill="#faf5f7" stroke="#d8c5cb"/><text x="523" y="194" font-size="17" fill="#99475f">3–4 / Own response</text><text x="523" y="218" font-size="13" fill="#625a5e">Choose a strategy</text><text x="523" y="239" font-size="13" fill="#625a5e">Write your response</text><path d="M691 211 L725 211" fill="none" stroke="#99475f" stroke-width="1.3" marker-end="url(#arrow)"/><rect x="726" y="167" width="224" height="91" fill="#faf5f7" stroke="#d8c5cb"/><text x="742" y="194" font-size="17" fill="#99475f">5 / End first task</text><text x="742" y="218" font-size="13" fill="#625a5e">Earlier help ends</text><text x="742" y="239" font-size="13" fill="#625a5e">Own memory cannot be erased</text><path d="M838 258 L838 340" fill="none" stroke="#99475f" stroke-width="1.3" marker-end="url(#arrow)"/><rect x="506" y="340" width="444" height="65" fill="#faf5f7" stroke="#d8c5cb"/><text x="522" y="367" font-size="17" fill="#99475f">6–7 / New unaided task → Review</text><text x="522" y="391" font-size="13" fill="#625a5e">No earlier text or trace in the task; local record afterward</text><text x="30" y="375" font-size="13" fill="#625a5e">Illustrative fictional situations.</text><text x="30" y="399" font-size="13" fill="#99475f">Working software ≠ evidence of learning.</text></g></svg>