<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img" aria-labelledby="title desc">
<title id="title">Scaffolding AI: assistance and transfer</title><desc id="desc">An implemented scripted demonstration uses one fictional situation in either substitution or scaffolding mode. Assistance is then removed for a new situation. Future behavioral studies, not the demonstration, would evaluate independent competence and human transfer.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#99475f" stroke-width="1.4"/></marker></defs>
<rect width="980" height="390" fill="#fcf7f8"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#171717">
<text x="30" y="35" font-size="13" fill="#99475f" letter-spacing="1">CURRENT DEMO: INTERACTION ROUTES + WITHDRAWAL</text>
<rect x="30" y="124" width="166" height="88" fill="#fff" stroke="#cbb4bc"/><text x="113" y="157" text-anchor="middle" font-size="19">Same fictional</text><text x="113" y="182" text-anchor="middle" font-size="19">situation</text>
<path d="M196 168 H223 V92 H249 M223 168 V252 H249" fill="none" stroke="#99475f" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="257" y="57" width="235" height="94" fill="#fff" stroke="#cbb4bc"/><text x="274" y="86" font-size="19" fill="#99475f">Substitution</text><text x="274" y="112" font-size="14">Interpretation → action → draft</text><text x="274" y="134" font-size="12" fill="#555">System supplies the response work.</text>
<rect x="257" y="204" width="235" height="104" fill="#fff" stroke="#cbb4bc"/><text x="274" y="234" font-size="19" fill="#99475f">Scaffolding</text><text x="274" y="260" font-size="14">Interpretation → evidence</text><text x="274" y="283" font-size="14">Alternatives → own response</text>
<path d="M492 103 H521 V169 H548 M492 254 H521 V169" fill="none" stroke="#99475f" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="556" y="124" width="165" height="88" fill="#fff" stroke="#cbb4bc"/><text x="638.5" y="158" text-anchor="middle" font-size="19">Assistance</text><text x="638.5" y="184" text-anchor="middle" font-size="19">removed</text>
<path d="M721 168 H762" fill="none" stroke="#99475f" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="773" y="111" width="177" height="113" fill="#fff" stroke="#cbb4bc"/><text x="861.5" y="144" text-anchor="middle" font-size="19">New situation</text><text x="861.5" y="172" text-anchor="middle" font-size="15">Own response</text><text x="861.5" y="198" text-anchor="middle" font-size="12" fill="#555">No prompts or draft</text>
<path d="M861 224 V288" fill="none" stroke="#99475f" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<text x="598" y="326" font-size="13" fill="#99475f">FUTURE RESEARCH</text><text x="598" y="350" font-size="16">Independent competence + human transfer?</text><text x="598" y="373" font-size="12" fill="#555">Requires controlled behavioral evidence; not scored by this demo.</text>
</g></svg>
