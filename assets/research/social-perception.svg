<title id="title">Multimodal social perception: analytical logic</title><desc id="desc">Facial expression, vocal prosody, and language provide social cues. Behavioral and text-derived indicators and reproducible R analysis inform the measurement of sincerity and moral intent. A conceptual overview, not one study protocol.</desc>
